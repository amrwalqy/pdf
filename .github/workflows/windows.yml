name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the Electron runtime
        run: node node_modules/electron/install.js

      - name: Type-check and unit tests
        run: npm run check

      - name: Build the desktop interface
        run: npm run desktop:build

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build installer and portable EXE
        # Signs only when the secrets are set. Tags (v*) must be signed, so an unsigned release fails here.
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $failed = $false
          Get-ChildItem release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed -and $env:REQUIRE_SIGNING -eq 'true') {
            throw 'Release build is not signed. Add WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD to the repository secrets.'
          }
          if ($failed) { Write-Host 'Unsigned build (no certificate configured). Allowed for non-release runs.' }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alif-windows
          path: release/*.exe
          if-no-files-found: error
